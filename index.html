
        <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOF 2002 — theyessus.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0F13; --surface: #16181F; --surface2: #1E2029;
      --border: rgba(255,255,255,0.07); --accent: #E8A24A;
      --text: #E8E6DF; --muted: #6B6A65; --radius: 14px;
    }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    .loader-content { width: 280px; text-align: center; }
    #splash-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--accent); margin: 0; }
    
    .progress-track { width: 100%; height: 6px; background: var(--surface2); border-radius: 10px; overflow: hidden; margin: 15px 0; }
    #dl-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
    
    #emulator-wrap { width: 100vw; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; }
    #game { width: 100%; height: 100%; }

    #btn-open-sidebar {
      position: fixed; bottom: 20px; right: 20px; z-index: 50;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 12px; border-radius: 50%; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="loader-content">
      <h1 id="splash-title">KOF 2002</h1>
      <p id="status-text" style="font-size: 0.8rem; color: var(--muted);">INICIANDO DESCARGA...</p>
      <div class="progress-track"><div id="dl-bar"></div></div>
      <div id="dl-label" style="font-family: monospace;">0%</div>
    </div>
  </div>

  <div id="emulator-wrap">
    <div id="game"></div>
  </div>

  <button id="btn-open-sidebar">⚙️</button>

  <script type="module">
    // CONFIGURACIÓN DE RUTAS
    const GITHUB_BASE = 'https://theyessus.github.io/emulator';
    const ROM_ID = '1jdkc_RIRvXUfXsMg05rj4kal0huVrie7'; // Tu ID de Drive
    
    const ROM_URL = `https://docs.google.com/uc?export=download&id=${ROM_ID}`;
    const BIOS_URL = `https://theyessus.github.io/emulator/neogeo.zip`;

    // 1. GESTIÓN DE CACHÉ (IndexedDB) para no descargar 78MB cada vez
    const SaveDB = {
      async _db() {
        return new Promise((res) => {
          const req = indexedDB.open('EJS_CACHE_V1', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('files');
          req.onsuccess = () => res(req.result);
        });
      },
      async get(key) {
        const db = await this._db();
        return new Promise(res => {
          const req = db.transaction('files').objectStore('files').get(key);
          req.onsuccess = () => res(req.result);
        });
      },
      async set(key, val) {
        const db = await this._db();
        db.transaction('files', 'readwrite').objectStore('files').put(val, key);
      }
    };

    // 2. DESCARGA CON PROGRESO REAL
    async function downloadWithProgress(url, label) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Error de conexión");
      
      const reader = resp.body.getReader();
      const total = +resp.headers.get('Content-Length') || 81788928; // Estimación para KOF2002
      let loaded = 0;
      let chunks = [];

      while(true) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        const pct = Math.min(Math.round((loaded / total) * 100), 99);
        document.getElementById('dl-bar').style.width = pct + '%';
        document.getElementById('dl-label').textContent = pct + '%';
        document.getElementById('status-text').textContent = `DESCARGANDO ${label}...`;
      }
      return new Blob(chunks);
    }

    // 3. CONFIGURACIÓN E INICIO DE EMULATORJS
    function startEmulatorJS(romBlob, biosBlob) {
      window.EJS_player = '#game';
      window.EJS_core = 'fbneo'; // FBNeo es el core correcto para evitar el error de la captura
      window.EJS_gameUrl = URL.createObjectURL(romBlob);
      window.EJS_biosUrl = URL.createObjectURL(biosBlob);
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_saveState = true;
      window.EJS_audioBufferSize = 4096;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
      
      // Ocultar splash cuando el emulador tome el control
      setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
      }, 2000);
    }

    // LÓGICA PRINCIPAL
    (async () => {
      try {
        let rom = await SaveDB.get('kof2002');
        let bios = await SaveDB.get('neogeo');

        if (!rom || !bios) {
          bios = await downloadWithProgress(BIOS_URL, 'BIOS (NEOGEO)');
          rom = await downloadWithProgress(ROM_URL, 'ROM (KOF 2002)');
          
          await SaveDB.set('kof2002', rom);
          await SaveDB.set('neogeo', bios);
        }

        document.getElementById('dl-bar').style.width = '100%';
        document.getElementById('dl-label').textContent = '100%';
        document.getElementById('status-text').textContent = "MOTOR LISTO";

        startEmulatorJS(rom, bios);
      } catch (err) {
        document.getElementById('status-text').textContent = "ERROR AL CARGAR DESDE DRIVE";
        document.getElementById('status-text').style.color = "#ff4444";
        console.error(err);
      }
    })();
  </script>
</body>
</html>
