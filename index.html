<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KOF 2002 — Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
        #loading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #E8A24A; font-family: sans-serif; background: #0E0F13; z-index: 10;
        }
        #loading.hide { display: none; }
    </style>
</head>
<body>

    <div id="loading">CARGANDO MOTOR...</div>
    <div id="game"></div>

    <script type="text/javascript">
        // 1. CONFIGURACIÓN LIMPIA
        var r2 = 'https://pub-ba5ec238faea469894f40acba1e873db.r2.dev';
        
        window.EJS_player = '#game';
        window.EJS_core = 'fbneo'; 
        window.EJS_gameUrl = r2 + '/kof2002.zip';
        window.EJS_biosUrl = r2 + '/neogeo.zip';
        
        // 2. CAMBIO DE SERVIDOR DE DATOS (Este es el que corrige el ErrnoError)
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        window.EJS_startOnLoaded = true;
        window.EJS_DEBUG = true;

        // 3. CARGA DEL LOADER
        var scr = document.createElement('script');
        scr.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(scr);

        // 4. OCULTAR CARGA
        window.addEventListener('message', function(e) {
            if (e.data === 'emulatorjs-game-loaded') {
                document.getElementById('loading').classList.add('hide');
            }
        });
    </script>
</body>
</html>
