<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOF 2002 — theyessus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0F13; --accent: #E8A24A; --text: #E8E6DF;
    }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash-title { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: var(--accent); margin: 0; }
    .loader { width: 40px; height: 40px; border: 3px solid rgba(232,162,74,0.2); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #game-container { width: 100vw; height: 100vh; background: #000; }
  </style>
</head>
<body>

  <div id="splash">
    <h1 id="splash-title">KOF 2002</h1>
    <div class="loader"></div>
    <p id="status">CARGANDO MOTOR...</p>
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
   <script>
  <script type="module">() => {
    <script>
  // 1. CONFIGURACIÓN UNIVERSAL (PC Y MÓVIL)
  const R2_URL = 'https://pub-ba5ec238faea469894f40acba1e873db.r2.dev';

  window.EJS_player = '#game';
  window.EJS_core = 'fbneo'; // El más compatible con NeoGeo
  window.EJS_gameUrl = `${R2_URL}/kof2002.zip`;
  window.EJS_biosUrl = `${R2_URL}/neogeo.zip`;
  
  // Cambiamos a la ruta 'latest' que suele ser más estable para móviles
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
  window.EJS_startOnLoaded = true;

  // 2. CARGA DEL MOTOR
  const script = document.createElement('script');
  script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
  document.body.appendChild(script);

  // 3. GESTIÓN DE PANTALLA (Para que no se quede pegado el splash)
  window.addEventListener('message', function(e) {
    // Si el emulador envía cualquier señal de vida, quitamos el splash
    if (e.data.includes('emulatorjs')) {
      const splash = document.getElementById('splash');
      if(splash) splash.classList.add('hidden');
    }
  });

  // 4. EL "DESPERTADOR" (Si en 12 seg no carga, forzamos la entrada)
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('hidden')) {
      console.log("Forzando visualización del emulador...");
      splash.classList.add('hidden');
    }
  }, 12000);
</script>
  
    
</script>
  
</script>
    
  </script>
</body>
</html>
