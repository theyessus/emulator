<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOF 2002 — theyessus.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0F13; --surface: #16181F; --surface2: #1E2029;
      --border: rgba(255,255,255,0.07); --accent: #E8A24A;
      --text: #E8E6DF; --muted: #6B6A65; --radius: 14px;
    }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    .loader-content { width: 300px; text-align: center; }
    #splash-title { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--accent); margin: 0; }
    
    .progress-track { width: 100%; height: 8px; background: var(--surface2); border-radius: 10px; overflow: hidden; margin: 20px 0 10px 0; }
    #dl-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
    
    #status-text { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
    #dl-label { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--accent); }

    #emulator-wrap { width: 100vw; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="splash">
    <div class="loader-content">
      <h1 id="splash-title">KOF 2002</h1>
      <div class="progress-track"><div id="dl-bar"></div></div>
      <div id="dl-label">0%</div>
      <p id="status-text">Conectando con el servidor...</p>
    </div>
  </div>

  <div id="emulator-wrap"><div id="game"></div></div>

  <script type="module">
    // URL DE DROPBOX REPARADA
    const ROM_URL = 'https://www.dropbox.com/scl/fi/g57leqv4iico93dfr4e71/kof2002.zip?rlkey=zn7ucdgvdiv4zrdorm13jqvy1&st=2774sffa&raw=1';
    const BIOS_URL = 'https://theyessus.github.io/emulator/neogeo.zip';

    // Base de datos local
    const CacheDB = {
      async _db() {
        return new Promise(res => {
          const req = indexedDB.open('KOF_CACHE_FINAL', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('files');
          req.onsuccess = () => res(req.result);
        });
      },
      async get(key) {
        const db = await this._db();
        return new Promise(res => {
          const r = db.transaction('files').objectStore('files').get(key);
          r.onsuccess = () => res(r.result);
        });
      },
      async set(key, val) {
        const db = await this._db();
        db.transaction('files', 'readwrite').objectStore('files').put(val, key);
      }
    };

    // Descarga corregida para evitar errores de conexión
    async function download(url, label) {
      try {
        const resp = await fetch(url, { mode: 'cors' });
        if (!resp.ok) throw new Error();
        
        const reader = resp.body.getReader();
        const total = +resp.headers.get('Content-Length') || 86000000;
        let loaded = 0;
        let chunks = [];

        while(true) {
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          const pct = Math.min(Math.round((loaded / total) * 100), 99);
          document.getElementById('dl-bar').style.width = pct + '%';
          document.getElementById('dl-label').textContent = pct + '%';
          document.getElementById('status-text').textContent = `Descargando ${label}...`;
        }
        return new Blob(chunks);
      } catch (e) {
        // Si falla el fetch por CORS, intentamos cargar directo (esto puede fallar la barra de progreso pero iniciar el juego)
        console.warn("Fallo fetch, intentando modo alternativo...");
        return url; 
      }
    }

    async function start(rom, bios) {
      window.EJS_player = '#game';
      window.EJS_core = 'fbneo';
      window.EJS_gameUrl = (typeof rom === 'string') ? rom : URL.createObjectURL(rom);
      window.EJS_biosUrl = (typeof bios === 'string') ? bios : URL.createObjectURL(bios);
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;

      const s = document.createElement('script');
      s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(s);
      
      setTimeout(() => document.getElementById('splash').classList.add('hidden'), 3500);
    }

    (async () => {
      try {
        let rom = await CacheDB.get('kof');
        let bios = await CacheDB.get('neo');

        if (!rom) {
          rom = await download(ROM_URL, 'Juego (82MB)');
          if (typeof rom !== 'string') await CacheDB.set('kof', rom);
        }
        if (!bios) {
          bios = await download(BIOS_URL, 'BIOS');
          if (typeof bios !== 'string') await CacheDB.set('neo', bios);
        }

        await start(rom, bios);
      } catch (err) {
        document.getElementById('status-text').textContent = "Error: El servidor bloqueó la conexión";
        document.getElementById('status-text').style.color = "#ff4444";
      }
    })();
  </script>
</body>
</html>
