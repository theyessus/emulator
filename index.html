<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOF 2002 — theyessus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0F13; --accent: #E8A24A; --text: #E8E6DF;
    }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash-title { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; color: var(--accent); margin: 0; }
    .loader { width: 40px; height: 40px; border: 3px solid rgba(232,162,74,0.2); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #game-container { width: 100vw; height: 100vh; background: #000; }
  </style>
</head>
<body>

  <div id="splash">
    <h1 id="splash-title">KOF 2002</h1>
    <div class="loader"></div>
    <p id="status">CARGANDO MOTOR...</p>
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // URL DIRECTA A TU RELEASE
    const ROM_URL = 'https://github.com/theyessus/emulator/releases/download/v1.0/kof2002.zip';
    const BIOS_URL = 'https://theyessus.github.io/emulator/neogeo.zip';

    window.EJS_player = '#game';
    window.EJS_core = 'fbneo'; // Motor más estable
    window.EJS_gameUrl = ROM_URL;
    window.EJS_biosUrl = BIOS_URL;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_DEBUG = false; // Cambia a true si quieres ver errores técnicos en consola

    // Cargamos el motor de EmulatorJS
    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);

    // Quitamos la pantalla de carga después de que el motor inicie
    window.addEventListener('message', function(e) {
      if (e.data === 'emulatorjs-game-loaded' || e.data === 'emulatorjs-core-loaded') {
        setTimeout(() => {
          document.getElementById('splash').classList.add('hidden');
        }, 2000);
      }
    });

    // Fallback: Si en 15 segundos no ha cargado, quitamos el splash igual
    setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
    }, 15000);
  </script>
</body>
</html>
