<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KOF 2002 - Final Build</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
        #game { width: 100vw; height: 100vh; }
        #overlay {
            position: fixed; inset: 0; background: #0E0F13;
            display: flex; align-items: center; justify-content: center;
            z-index: 99; cursor: pointer; text-align: center;
        }
        .btn {
            padding: 15px 30px; border: 2px solid #E8A24A; color: #E8A24A;
            text-transform: uppercase; font-weight: bold; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEmulator()">
        <div id="status-container">
            <div class="btn" id="btn-text">Cargando datos...</div>
            <p style="font-size: 11px; margin-top: 15px; color: #666;">(Si tarda, pulsa aquí para forzar el inicio)</p>
        </div>
    </div>

    <div id="game"></div>

    <script type="text/javascript">
        var r2 = 'https://pub-ba5ec238faea469894f40acba1e873db.r2.dev';
        
        window.EJS_player = '#game';
        window.EJS_core = 'fbneo'; 
        window.EJS_gameUrl = r2 + '/kof2002.zip';
        window.EJS_biosUrl = r2 + '/neogeo.zip';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_language = 'en-US';

        // CARGA DEL MOTOR
        var ejs = document.createElement('script');
        ejs.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(ejs);

        // --- ESTE ES EL SCRIPT DE "LIMPIEZA FORZADA" ---
        // Se ejecuta cada segundo para verificar si el juego ya arrancó
        setInterval(function() {
            // 1. Buscamos cualquier capa que diga "Cargando" o "Splash"
            var loader = document.getElementById('status') || 
                         document.getElementById('overlay') || 
                         document.getElementById('splash');
            
            // 2. Si detectamos que los controles de EmulatorJS ya aparecieron
            // o si escuchas audio, borramos la capa de carga.
            if (document.querySelector('.emulatorjs-controls') || document.querySelector('canvas')) {
                if (loader) {
                    loader.style.display = 'none';
                    loader.style.opacity = '0';
                    loader.style.pointerEvents = 'none'; // Para que no bloquee los clics
                }
            }
        }, 1000);

        // Forzar enfoque al hacer clic para activar controles y video
        document.addEventListener('click', function() {
            var canvas = document.querySelector('canvas');
            if (canvas) canvas.focus();
        });
    </script>
</body>
</html>
