<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOF 2002 — theyessus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0E0F13; --surface: #16181F; --surface2: #1E2029;
      --border: rgba(255,255,255,0.07); --accent: #E8A24A;
      --text: #E8E6DF; --muted: #6B6A65; --radius: 14px;
    }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s; }
    #splash.hidden { opacity: 0; visibility: hidden; }
    .loader-content { width: 300px; text-align: center; }
    #splash-title { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--accent); margin: 0; }
    
    .progress-track { width: 100%; height: 8px; background: var(--surface2); border-radius: 10px; overflow: hidden; margin: 20px 0 10px 0; }
    #dl-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
    #dl-label { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--accent); }

    #emulator-wrap { width: 100vw; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; }
    #game { width: 100%; height: 100%; }

    #btn-open-sidebar {
      position: fixed; bottom: 25px; right: 25px; z-index: 50;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 15px; border-radius: 50%; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="loader-content">
      <h1 id="splash-title">KOF 2002</h1>
      <div class="progress-track"><div id="dl-bar"></div></div>
      <div id="dl-label">0%</div>
      <p id="status-text" style="font-size:0.75rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase;">Iniciando descarga de Release...</p>
    </div>
  </div>

  <div id="emulator-wrap">
    <div id="game"></div>
  </div>

  <button id="btn-open-sidebar">⚙️</button>

  <script type="module">
    // ────────────────────────────────────────────────────────────────
    // CONFIGURACIÓN DE TU RELEASE (https://github.com/theyessus/emulator/releases/download/kof/kof2002.zip)
    // ────────────────────────────────────────────────────────────────
    const ROM_RELEASE_URL = 'https://github.com/theyessus/emulator/releases/download/v1.0/kof2002.zip';
    const BIOS_URL = 'https://theyessus.github.io/emulator/neogeo.zip';

    // Proxy para evitar el bloqueo CORS de GitHub Releases
    const PROXY = 'https://corsproxy.io/?';

    const CacheDB = {
      async _db() {
        return new Promise(res => {
          const req = indexedDB.open('KOF_FINAL_STORAGE', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('files');
          req.onsuccess = () => res(req.result);
        });
      },
      async get(key) {
        const db = await this._db();
        return new Promise(res => {
          const r = db.transaction('files').objectStore('files').get(key);
          r.onsuccess = () => res(r.result);
        });
      },
      async set(key, val) {
        const db = await this._db();
        db.transaction('files', 'readwrite').objectStore('files').put(val, key);
      }
    };

    async function download(url, label) {
      // Si el archivo viene de GitHub, usamos el proxy para que no nos bloquee
      const finalUrl = url.includes('github.com') ? PROXY + encodeURIComponent(url) : url;
      
      const resp = await fetch(finalUrl);
      if (!resp.ok) throw new Error("Error de conexión");
      
      const reader = resp.body.getReader();
      const total = +resp.headers.get('Content-Length') || 86093824; 
      let loaded = 0;
      let chunks = [];

      while(true) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        const pct = Math.min(Math.round((loaded / total) * 100), 99);
        document.getElementById('dl-bar').style.width = pct + '%';
        document.getElementById('dl-label').textContent = pct + '%';
        document.getElementById('status-text').textContent = `Descargando ${label}...`;
      }
      return new Blob(chunks);
    }

    async function start(romBlob, biosBlob) {
      window.EJS_player = '#game';
      window.EJS_core = 'fbneo'; // Core estable para NeoGeo
      window.EJS_gameUrl = URL.createObjectURL(romBlob);
      window.EJS_biosUrl = URL.createObjectURL(biosBlob);
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_saveState = true;

      const loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(loader);
      
      setTimeout(() => document.getElementById('splash').classList.add('hidden'), 3000);
    }

    (async () => {
      try {
        let rom = await CacheDB.get('kof');
        let bios = await CacheDB.get('neo');

        if (!rom || !bios) {
          bios = await download(BIOS_URL, 'BIOS');
          rom = await download(ROM_RELEASE_URL, 'KOF 2002 (82MB)');
          await CacheDB.set('kof', rom);
          await CacheDB.set('neo', bios);
        }

        start(rom, bios);
      } catch (e) {
        document.getElementById('status-text').textContent = "ERROR: No se pudo conectar con GitHub";
        document.getElementById('status-text').style.color = "#ff4444";
      }
    })();
  </script>
</body>
</html>
